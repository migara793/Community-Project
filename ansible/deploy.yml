---
- name: Deploy React Flask Application
  hosts: web_server
  become: yes
  vars:
    react_port: 3000
    flask_port: 5000
    nginx_port: 80
    app_user: ubuntu
    react_image: "migara37/community-client:latest"
    flask_image: "migara37/community-server:latest"
    domain_name: "your-domain.com"  # Set your domain here
    docker_compose_version: "v2.23.0"

  handlers:
    - name: Restart Docker
      systemd:
        name: docker
        state: restarted
        enabled: yes
      listen: "docker config changed"

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install prerequisites
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
          - gnupg-agent
        state: present

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker-ce
        update_cache: yes

    - name: Install Docker packages
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    # === Fixed Kernel Package Installation ===
    - name: Install kernel extras if available
      apt:
        name: "linux-modules-extra-{{ ansible_kernel }}"
        state: present
      ignore_errors: yes
      register: kernel_extras_install

    - name: Debug kernel extras installation
      debug:
        msg: "Kernel extras installed successfully"
      when: kernel_extras_install is succeeded

    - name: Debug kernel extras failure
      debug:
        msg: "Kernel extras not available, continuing anyway (likely already included)"
      when: kernel_extras_install is failed
    # === End Fix ===

    - name: Load required kernel modules
      modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Ensure kernel modules persist after reboot
      lineinfile:
        path: /etc/modules
        line: "{{ item }}"
        state: present
        create: yes
      loop:
        - overlay
        - br_netfilter

    - name: Configure kernel parameters
      sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
        sysctl_set: yes
        reload: yes
      loop:
        - { key: 'net.bridge.bridge-nf-call-iptables', value: '1' }
        - { key: 'net.bridge.bridge-nf-call-ip6tables', value: '1' }
        - { key: 'net.ipv4.ip_forward', value: '1' }

    - name: Create Docker config directory
      file:
        path: /etc/docker
        state: directory
        mode: '0755'

    - name: Configure Docker storage
      copy:
        content: |
          {
            "storage-driver": "overlay2",
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "10m",
              "max-file": "3"
            }
          }
        dest: /etc/docker/daemon.json
        mode: '0644'
      notify: "docker config changed"

    - name: Start and enable Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add ubuntu user to docker group
      user:
        name: "{{ app_user }}"
        groups: docker
        append: yes

    - name: Create application directory
      file:
        path: /opt/app
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0755'

    - name: Stop and remove existing app containers
      community.docker.docker_compose_v2:
        project_src: /opt/app
        state: absent
      ignore_errors: yes

    - name: Pull latest images
      docker_image:
        name: "{{ item }}"
        source: pull
        force_source: yes
      loop:
        - "{{ react_image }}"
        - "{{ flask_image }}"
      become_user: "{{ app_user }}"

    - name: Create Docker Compose file
      copy:
        content: |
          version: '3.8'
          services:
            flask-backend:
              image: {{ flask_image }}
              container_name: flask-backend
              ports:
                - "0.0.0.0:{{ flask_port }}:5000"
              restart: unless-stopped
              healthcheck:
                test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
                interval: 30s
                timeout: 10s
                retries: 5
                start_period: 20s

            react-frontend:
              image: {{ react_image }}
              container_name: react-frontend
              ports:
                - "0.0.0.0:{{ react_port }}:3000"
              environment:
                - NODE_ENV=production
                - REACT_APP_API_URL=http://flask-backend:5000
              depends_on:
                flask-backend:
                  condition: service_healthy
              restart: unless-stopped
              healthcheck:
                test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
                interval: 30s
                timeout: 10s
                retries: 5
                start_period: 40s
        dest: /opt/app/docker-compose.yml
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0644'

    - name: Start applications with Docker Compose v2
      community.docker.docker_compose_v2:
        project_src: /opt/app
        state: present
        pull: yes
        restarted: yes
      become_user: "{{ app_user }}"

    - name: Wait for Flask backend to be healthy
      uri:
        url: "http://localhost:{{ flask_port }}/health"
        method: GET
        status_code: 200
      register: flask_health
      until: flask_health.status == 200
      retries: 10
      delay: 5

    - name: Configure Nginx as reverse proxy
      copy:
        content: |
          upstream flask_backend {
              server 127.0.0.1:{{ flask_port }};
          }

          upstream react_frontend {
              server 127.0.0.1:{{ react_port }};
          }

          server {
              listen {{ nginx_port }};
              server_name {{ domain_name }} {{ ansible_host }};

              location / {
                  proxy_pass http://react_frontend;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }

              location /api/ {
                  rewrite ^/api/(.*)$ /$1 break;
                  proxy_pass http://flask_backend;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }

              location /health {
                  proxy_pass http://flask_backend/health;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
              }
          }
        dest: /etc/nginx/sites-available/app
        backup: yes

    - name: Enable Nginx site
      file:
        src: /etc/nginx/sites-available/app
        dest: /etc/nginx/sites-enabled/app
        state: link

    - name: Remove default Nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Test Nginx configuration
      command: nginx -t
      register: nginx_test
      changed_when: false
      failed_when: nginx_test.rc != 0

    - name: Restart and enable Nginx
      systemd:
        name: nginx
        state: restarted
        enabled: yes

    - name: Configure firewall
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "22"
        - "{{ nginx_port }}"
        - "{{ flask_port }}"
        - "{{ react_port }}"
      when: ansible_os_family == 'Debian'

    - name: Enable firewall
      ufw:
        state: enabled
        policy: deny

    - name: Display deployment status
      debug:
        msg: |
          ✅ Deployment successful!
          Public URL: http://{{ ansible_host }}
          React: http://{{ ansible_host }}:{{ react_port }}
          Flask API: http://{{ ansible_host }}:{{ flask_port }}
          Health Check: http://{{ ansible_host }}/health