---
- name: Deploy React Flask Application
  hosts: web_server
  become: yes
  vars:
    react_port: 3000
    flask_port: 5000
    nginx_port: 80
    app_user: ubuntu
    react_image: "migara37/community-client:latest"
    flask_image: "migara37/community-server:latest"
    domain_name: "your-domain.com"  # Set your domain here
    docker_compose_version: "v2.23.0"  # Define version for easy updates

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - docker.io
          - docker-compose-plugin  # Required for v2 compatibility
          - nginx
          - curl
          - unzip
          - python3-pip
        state: present

    - name: Install Docker Compose v2
      get_url:
        url: "https://github.com/docker/compose/releases/download/{{ docker_compose_version }}/docker-compose-linux-x86_64"
        dest: /usr/local/bin/docker-compose
        mode: '0755'
        owner: root
        group: root
      register: docker_compose_install
      when: ansible_os_family == 'Debian'

    - name: Verify Docker Compose version
      command: docker compose version
      register: compose_version
      changed_when: false
      failed_when: "'Docker Compose version' not in compose_version.stdout"

    - name: Start and enable Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add ubuntu user to docker group
      user:
        name: "{{ app_user }}"
        groups: docker
        append: yes

    - name: Create application directory
      file:
        path: /opt/app
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0755'

    - name: Stop and remove existing app containers
      community.docker.docker_compose_v2:
        project_src: /opt/app
        state: absent
      ignore_errors: yes

    - name: Pull latest images
      docker_image:
        name: "{{ item }}"
        source: pull
        force_source: yes
      loop:
        - "{{ react_image }}"
        - "{{ flask_image }}"
      become_user: "{{ app_user }}"

    - name: Create Docker Compose file
      copy:
        content: |
          version: '3.8'
          services:
            flask-backend:
              image: {{ flask_image }}
              container_name: flask-backend
              ports:
                - "0.0.0.0:{{ flask_port }}:5000"
              restart: unless-stopped
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
                interval: 30s
                timeout: 10s
                retries: 3
                start_period: 40s

            react-frontend:
              image: {{ react_image }}
              container_name: react-frontend
              ports:
                - "0.0.0.0:{{ react_port }}:3000"
              environment:
                - NODE_ENV=production
                - REACT_APP_API_URL=http://flask-backend:5000
              depends_on:
                flask-backend:
                  condition: service_healthy
              restart: unless-stopped
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost:3000"]
                interval: 30s
                timeout: 10s
                retries: 3
                start_period: 40s
        dest: /opt/app/docker-compose.yml
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0644'

    - name: Start applications with Docker Compose v2
      community.docker.docker_compose_v2:
        project_src: /opt/app
        state: present
        pull: yes
        restarted: yes
      become_user: "{{ app_user }}"

    - name: Wait for Flask backend to be healthy
      uri:
        url: "http://localhost:{{ flask_port }}/health"
        method: GET
        status_code: 200
      register: flask_health
      until: flask_health.status == 200
      retries: 10
      delay: 5

    - name: Configure Nginx as reverse proxy
      copy:
        content: |
          upstream flask_backend {
              server 127.0.0.1:{{ flask_port }};
          }

          upstream react_frontend {
              server 127.0.0.1:{{ react_port }};
          }

          server {
              listen {{ nginx_port }};
              server_name {{ domain_name }} {{ ansible_host }};

              location / {
                  proxy_pass http://react_frontend;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }

              location /api/ {
                  proxy_pass http://flask_backend/;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }

              location /health {
                  proxy_pass http://flask_backend/health;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
              }
          }
        dest: /etc/nginx/sites-available/app
        backup: yes

    - name: Enable Nginx site
      file:
        src: /etc/nginx/sites-available/app
        dest: /etc/nginx/sites-enabled/app
        state: link

    - name: Remove default Nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Test Nginx configuration
      command: nginx -t
      register: nginx_test
      changed_when: false
      failed_when: nginx_test.rc != 0

    - name: Restart and enable Nginx
      systemd:
        name: nginx
        state: restarted
        enabled: yes

    - name: Open firewall ports
      ufw:
        port: "{{ item }}"
        state: enabled
        proto: tcp
      loop:
        - "{{ nginx_port }}"
        - "{{ flask_port }}"
        - "{{ react_port }}"
      when: ansible_os_family == 'Debian'

    - name: Display deployment status
      debug:
        msg: |
          ✅ Deployment successful!
          Public URL: http://{{ ansible_host }}
          React: http://{{ ansible_host }}:{{ react_port }}
          Flask API: http://{{ ansible_host }}:{{ flask_port }}
          Health Check: http://{{ ansible_host }}/health