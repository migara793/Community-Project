name: Build Docker Images

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'server/**'

jobs:
  build-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and Push Client Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/community-client:latest ./client
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/community-client:latest

  build-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and Push Server Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/community-server:latest ./server
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/community-server:latest