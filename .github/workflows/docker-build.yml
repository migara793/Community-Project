name: Build Docker Images

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'server/**'  # Fixed typo: 'sever' → 'server'

jobs:
  build-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Create and use proper builder
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: |
            image=moby/buildkit:master  # Use latest buildkit
          buildkitd-config: |
            [worker.oci]
              enabled = true
              max-parallelism = 4
          install: true
          use: true
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and Push Client Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/community-client:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/community-client:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Add these builder options:
          builder: ${{ steps.buildx.outputs.name }}
          load: false

  build-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        id: buildx  # Add ID for reference
        with:
          driver: docker-container
          driver-opts: |
            image=moby/buildkit:master
          buildkitd-config: |
            [worker.oci]
              enabled = true
              max-parallelism = 4
          install: true
          use: true
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and Push Server Image
        uses: docker/build-push-action@v5
        with:
          context: ./server  # Fixed typo: 'sever' → 'server'
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/community-server:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/community-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Add these builder options:
          builder: ${{ steps.buildx.outputs.name }}
          load: false