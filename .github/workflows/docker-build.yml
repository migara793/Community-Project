name: Build Docker Images

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'sever/**'

jobs:
  build-client:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{secrets.DOCKERHUB_USERNAME}}
        password: ${{secrets.DOCKERHUB_TOKEN}}
    - name: Build and Push Client Image
      uses: docker/build-push-action@v5
      with:
        context: ./client
        file: ./client/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/community-client:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/community-client:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  build-server:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build and Push Server Image
      uses: docker/build-push-action@v5
      with:
        context: ./sever
        file: ./sever/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/community-server:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/community-server:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max