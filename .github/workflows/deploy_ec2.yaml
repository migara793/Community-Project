name: Deploy Application

on:
  push:
    branches: [main]

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: us-east-1
  TF_STATE_BUCKET_NAME: ${{ secrets.AWS_TF_STATE_BUCKET_NAME }}
  TF_STATE_BUCKET_REGION: us-east-1
  TF_LOCK_TABLE: terraform-lock
  PUBLIC_SSH_KEY: ${{ secrets.AWS_SSH_KEY_PUBLIC }}
  PRIVATE_SSH_KEY: ${{ secrets.AWS_SSH_KEY_PRIVATE }}

jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET_NAME" \
            -backend-config="region=$TF_STATE_BUCKET_REGION" \
            -backend-config="dynamodb_table=$TF_LOCK_TABLE" \
            -backend-config="encrypt=true"
        working-directory: ./terraform

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="region=$AWS_REGION" \
            -var="public_key=$PUBLIC_SSH_KEY" \
            -var="private_key=$PRIVATE_SSH_KEY" \
            -var="key_name=github-actions-key" \
            -out=PLAN
        working-directory: ./terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve PLAN
        working-directory: ./terraform

      - name: Get Public IP
        id: get-ip
        run: |
          cd terraform
          IP=$(terraform output -raw instance_public_ip)
          echo "PUBLIC_IP=$IP" >> $GITHUB_ENV
          echo $IP > public_ip.txt
          echo "IP: $IP"

      - name: Upload Public IP
        uses: actions/upload-artifact@v4
        with:
          name: public-ip
          path: terraform/public_ip.txt

  deploy-with-ansible:
    needs: deploy-infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Download Public IP
        uses: actions/download-artifact@v4
        with:
          name: public-ip
          path: .

      - name: Read Public IP
        id: read-ip
        run: |
          PUBLIC_IP=$(cat public_ip.txt)
          echo "PUBLIC_IP=$PUBLIC_IP" >> $GITHUB_ENV
          echo "IP: $PUBLIC_IP"

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Ansible
        run: sudo apt-get update && sudo apt-get install -y ansible

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_SSH_KEY_PRIVATE }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$PUBLIC_IP" >> ~/.ssh/known_hosts
          echo "Added host to known_hosts"

      - name: Run Ansible Playbook
        run: |
          ansible-playbook -i "$PUBLIC_IP," ansible/deploy.yml \
            --user ubuntu \
            --private-key ~/.ssh/deploy_key

  verify-deployment:
    needs: [deploy-infrastructure, deploy-with-ansible]
    runs-on: ubuntu-latest
    steps:
      - name: Download Public IP
        uses: actions/download-artifact@v4
        with:
          name: public-ip
          path: .

      - name: Read Public IP
        id: read-ip
        run: |
          PUBLIC_IP=$(cat public_ip.txt)
          echo "PUBLIC_IP=$PUBLIC_IP" >> $GITHUB_ENV

      - name: Verify React App
        run: |
          curl -sSf "http://$PUBLIC_IP:3000" || exit 1

      - name: Verify Flask App
        run: |
          curl -sSf "http://$PUBLIC_IP:5000/health" || exit 1

  notify-completion:
    needs: [deploy-infrastructure, deploy-with-ansible, verify-deployment]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download Public IP
        uses: actions/download-artifact@v4
        with:
          name: public-ip
          path: .

      - name: Read Public IP
        id: read-ip
        run: |
          PUBLIC_IP=$(cat public_ip.txt)
          echo "PUBLIC_IP=$PUBLIC_IP" >> $GITHUB_ENV

      - name: Notify Deployment Status
        run: |
          if [ "${{ needs.deploy-infrastructure.result }}" == "success" ] && \
             [ "${{ needs.deploy-with-ansible.result }}" == "success" ] && \
             [ "${{ needs.verify-deployment.result }}" == "success" ]; then
            echo "✅ Deployment completed successfully!"
            echo "React App: http://$PUBLIC_IP:3000"
            echo "Flask App: http://$PUBLIC_IP:5000"
          else
            echo "❌ Deployment failed!"
            echo "Infrastructure: ${{ needs.deploy-infrastructure.result }}"
            echo "Ansible: ${{ needs.deploy-with-ansible.result }}"
            echo "Verification: ${{ needs.verify-deployment.result }}"
            exit 1
          fi